{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

{% if page.citation_title %}
<meta name="citation_title" content="{{ page.citation_title | escape_once }}">
{% for author in page.citation_authors %}
<meta name="citation_author" content="{{ author | escape_once }}">
{% endfor %}
<meta name="citation_publication_date" content="{{ page.date | date: '%Y/%m/%d' }}">
{% if page.citation_dissertation_institution %}<meta name="citation_dissertation_institution" content="{{ page.citation_dissertation_institution | escape_once }}">{% endif %}
{% if page.citation_pdf_url %}<meta name="citation_pdf_url" content="{{ page.citation_pdf_url | absolute_url }}">{% endif %}
{% endif %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">
